hu:
  site_settings:
    resonite_oauth_enabled: Engedélyezze az OpenID Connect hitelesítést. A felhasználói felület szövegeit <a href='%{base_path}/admin/customize/site_texts?q=js.login.resonite'>itt</a> szabhatja testre.
    resonite_oauth_discovery_document_url: "OpenID Connect felfedezési dokumentum URL-je. Általában a 'https://your.domain/.well-known/openid-configuration' útvonalon található."
    resonite_oauth_client_id: "OpenID Connect ügyfélazonosító"
    resonite_oauth_client_secret: "OpenID Connect kliens titkos kódja"
    resonite_oauth_authorize_scope: "Az autorizációs (hitelesítési) végpontnak elküldött hatókörök (scopes). Ennek tartalmaznia kell az 'openid' értéket."
    resonite_oauth_rp_initiated_logout: "Kijelentkezés után a felhasználó átirányítása az end_session_endpoint végpontra. Ezt a funkciót az identitásszolgáltatónak támogatnia kell, és szerepelnie kell a felfedezési (discovery) dokumentumban."
    resonite_oauth_rp_initiated_logout_redirect: "(opcionális) A kijelentkezési végpontnak átadott post_logout_redirect_uri. Ha megadásra kerül, regisztrálva kell lennie az identitásszolgáltatónál."
    resonite_oauth_rp_initiated_logout_include_client_id: "(opcionális) A client_id (resonite_oauth_client_id beállítás) hozzáfűzése lekérdezési paraméterként (query parameter) a kijelentkezési végponthoz."
    resonite_oauth_error_redirects: "Ha a visszahívási (callback) hiba oka tartalmazza az első paramétert, a felhasználó a második paraméterben megadott URL-re lesz átirányítva."
    resonite_oauth_allow_association_change: "Lehetővé teszi a felhasználók számára, hogy leválasszák, majd újra összekapcsolják Discourse-fiókjukat az OpenID Connect szolgáltatóval."
    resonite_oauth_verbose_logging: "Részletes OpenID Connect hitelesítési adatok naplózása a /logs mappába. Normál használat mellett hagyja kikapcsolva."
    resonite_oauth_overrides_email: "Minden bejelentkezéskor felülírja a felhasználó e-mail-címét az OpenID Connect értékével. Ugyanúgy működik, mint az auth_overrides_email beállítás, de kifejezetten az OpenID Connect bejelentkezésekre vonatkozik."
    resonite_oauth_match_by_email: "E-mail-cím használata az OpenID Connect hitelesítések és a meglévő Discourse felhasználói fiókok összekapcsolásához."
    resonite_oauth_use_pkce: "A PKCE (Proof Key for Code Exchange) engedélyezése az OpenID Connect hitelesítéshez."
  login:
    omniauth_error:
      resonite_oauth_discovery_error: Nem sikerült lekérni a konfigurációt az identitásszolgáltatótól. Kérjük, próbálja újra.

