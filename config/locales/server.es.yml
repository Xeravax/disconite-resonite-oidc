es:
  site_settings:
    resonite_oauth_enabled: Activa la autenticación de OpenID Connect. Personaliza el texto de la interfaz de usuario <a href='%{base_path}/admin/customize/site_texts?q=js.login.resonite'>aquí</a>.
    resonite_oauth_discovery_document_url: "URL del documento de descubrimiento de OpenID Connect. Normalmente ubicado en 'https://your.domain/.well-known/openid-configuration'"
    resonite_oauth_client_id: "ID de cliente de OpenID Connect"
