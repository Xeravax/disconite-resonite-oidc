    resonite_oauth_authorize_scope: "Los ámbitos enviados al terminal autorizado. Esto debe incluir «openid»."
    resonite_oauth_rp_initiated_logout: "Redirigir al usuario a end_session_endpoint después de cerrar sesión. Debe estar respaldado por su proveedor de identidad e incluido en el documento de descubrimiento."
    resonite_oauth_rp_initiated_logout_redirect: "(opcional) El post_logout_redirect_uri que se pasará al terminal de cierre de sesión. Si se proporciona, debe registrarse con el proveedor de identidad."
    resonite_oauth_rp_initiated_logout_include_client_id: "(opcional) Añade el id_cliente (ajuste resonite_oauth_client_id) como parámetro de consulta al terminal de cierre de sesión"
