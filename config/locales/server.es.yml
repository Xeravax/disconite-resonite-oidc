    resonite_oauth_allow_association_change: "Permitir a los usuarios desconectar y volver a conectar sus cuentas de Discourse desde el proveedor OpenID Connect"
    resonite_oauth_verbose_logging: "Registrar la información detallada de la autenticación de openid-connect en `/logs`. Mantén esto desactivado durante el uso normal."
    resonite_oauth_overrides_email: "En cada inicio de sesión, sobrescribir el correo electrónico del usuario con el valor openid-connect. Funciona igual que la configuración `auth_overrides_email`, pero es específica de los inicios de sesión de OpenID Connect."
    resonite_oauth_match_by_email: "Utiliza la dirección de correo electrónico para asociar las autenticaciones de OpenID Connect con las cuentas de usuario de Discourse existentes."
    resonite_oauth_use_pkce: "Activar la Clave de Prueba para el Intercambio de Códigos (PKCE) para la autenticación de OpenID Connect."
  login:
    omniauth_error:
