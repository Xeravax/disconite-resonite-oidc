ar:
  site_settings:
    resonite_oauth_enabled: تفعيل مصادقة OpenID Connect. يمكنك تخصيص نص واجهة المستخدم من <a href='%{base_path}/admin/customize/site_texts?q=js.login.resonite'>هنا</a>
    resonite_oauth_discovery_document_url: "عنوان URL لمستند استكشاف OpenID Connect. موجود عادةً على \"https://your.domain/.well-known/openid-configuration\""
    resonite_oauth_client_id: "معرِّف العميل لـ OpenID Connect"
    resonite_oauth_client_secret: "سر عميل OpenID Connect"
    resonite_oauth_authorize_scope: "النطاقات المرسلة إلى نقطة نهاية المصادقة. يجب أن يتضمَّن ذلك 'openid'."
    resonite_oauth_rp_initiated_logout: "إعادة توجيه المستخدام إلى end_session_endpoint بعد تسجيل الخروج. يجب دعم هذا الإعداد من قِبل موفِّر الهوية وتضمينه في مستند الاستكشاف."
    resonite_oauth_rp_initiated_logout_redirect: "(اختياري) post_logout_redirect_uri الذي سيتم تمريره إلى نقطة نهاية تسجيل الخروج. في حال إدخاله، فإنه يجب تسجيله باستخدام موفِّر الهوية."
    resonite_oauth_rp_initiated_logout_include_client_id: "(اختياري) أضف client_id (الإعداد resonite_oauth_client_id) كمعامل استعلام إلى نقطة نهاية تسجيل الخروج"
    resonite_oauth_error_redirects: "إذا كان رد الاتصال error_reason يحتوي على المعلمة الأولى، فستتم إعادة توجيه المستخدم إلى عنوان URL في المعلمة الثانية"
    resonite_oauth_allow_association_change: "السماح للمستخدمين بإلغاء ربط حسابات Discourse وإعادة ربطها من مقدِّم خدمة OpenID Connect"
    resonite_oauth_verbose_logging: "تسجيل معلومات مصادقة openid-connect المفصَّلة في `/logs`. اترك هذا الإعداد متوقفًا خلال الاستخدام العادي."
    resonite_oauth_overrides_email: "تجاوز عنوان البريد الإلكتروني للمستخدم باستخدام قيمة openid-connect في كل عملية تسجيل دخول. يعمل هذا الإعداد بنفس طريقة عمل `auth_overrides_email`، لكنه خاص بعمليات تسجيل الدخول باستخدام OpenID Connect."
    resonite_oauth_match_by_email: "استخدم عنوان البريد الإلكتروني لمطابقة مصادقات OpenID Connect مع حسابات مستخدمي Discourse الموجودة."
    resonite_oauth_use_pkce: "تفعيل Proof Key for Code Exchange (PKCE) لمصادقة OpenID Connect."
  login:
    omniauth_error:
      resonite_oauth_discovery_error: يتعذَّر جلب التهيئة من موفِّر الهوية. يُرجى إعادة المحاولة.

