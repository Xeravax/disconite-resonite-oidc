uk:
  site_settings:
    resonite_oauth_enabled: Увімкнути автентифікацію OpenID Connect. Налаштувати текст інтерфейсу користувача <a href='%{base_path}/admin/customize/site_texts?q=js.login.resonite'>тут</a>
    resonite_oauth_discovery_document_url: "URL-адреса документа для виявлення OpenID Connect. Зазвичай розташована за адресою «https://your.domain/.well-known/openid-configuration»."
    resonite_oauth_client_id: "Ідентифікатор клієнта OpenID Connect"
    resonite_oauth_client_secret: "Секрет клієнта OpenID Connect"
    resonite_oauth_authorize_scope: "Області видимості, надіслані до кінцевої точки авторизації. Вони повинні містити «openid»."
    resonite_oauth_rp_initiated_logout: "Перенаправляти користувача до end_session_endpoint після виходу з системи. Має підтримуватися вашим постачальником ідентифікаційних даних та бути включеним до документа виявлення."
    resonite_oauth_rp_initiated_logout_redirect: "(необов’язково) post_logout_redirect_uri, який буде передано кінцевій точці виходу з системи. Якщо його надано, його потрібно зареєструвати у постачальника ідентифікаційних даних."
    resonite_oauth_rp_initiated_logout_include_client_id: "(необов’язково) Додайте client_id (параметр resonite_oauth_client_id) як параметр запиту до кінцевої точки виходу з системи"
    resonite_oauth_error_redirects: "Якщо error_reason містить перший параметр, користувач буде перенаправлений на URL-адресу в другому параметрі"
    resonite_oauth_allow_association_change: "Дозволити користувачам відключати та повторно підключати свої облікові записи Discourse від постачальника OpenID Connect"
    resonite_oauth_verbose_logging: "Записувати детальну інформацію про автентифікацію openid-connect до `/logs`. Під час звичайного використання тримайте цю функцію вимкненою."
    resonite_oauth_overrides_email: "Під час кожного входу замінювати електронну адресу користувача за допомогою значення openid-connect. Працює так само, як і налаштування `auth_overrides_email`, але стосується лише входу в OpenID Connect."
    resonite_oauth_match_by_email: "Використовувати адресу електронної пошти для зіставлення автентифікацій OpenID Connect з існуючими обліковими записами користувачів Discourse."
    resonite_oauth_use_pkce: "Увімкнути ключ підтвердження для обміну кодом (PKCE) для автентифікації OpenID Connect."
  login:
    omniauth_error:
      resonite_oauth_discovery_error: Не вдалося отримати конфігурацію від постачальника ідентифікаційних даних. Спробуйте ще раз.

