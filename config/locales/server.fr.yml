fr:
  site_settings:
    resonite_oauth_enabled: Activez l'authentification OpenID Connect. Personnalisez le texte de l'interface utilisateur <a href='%{base_path}/admin/customize/site_texts?q=js.login.resonite'>ici</a>
    resonite_oauth_discovery_document_url: "URL du document de découverte OpenID Connect. Normalement situé à l'adresse https://your.domain/.well-known/openid-configuration"
    resonite_oauth_client_id: "ID de client OpenID Connect"
    resonite_oauth_client_secret: "Secret du client OpenID Connect"
    resonite_oauth_authorize_scope: "Les autorisations envoyées au point de terminaison d'autorisation. Cela doit inclure « openid »."
    resonite_oauth_rp_initiated_logout: "Rediriger l'utilisateur vers end_session_endpoint après la déconnexion. Doit être supporté par votre fournisseur d'identité et inclus dans le document de découverte."
    resonite_oauth_rp_initiated_logout_redirect: "(facultatif) Le post_logout_redirect_uri qui sera transmis au point de terminaison de déconnexion. S'il est fourni, il doit être enregistré auprès du fournisseur d'identité."
    resonite_oauth_error_redirects: "Si le rappel error_reason contient le premier paramètre, l'utilisateur sera redirigé vers l'adresse URL reprise dans le deuxième paramètre"
    resonite_oauth_allow_association_change: "Autoriser les utilisateurs à déconnecter et à reconnecter leurs comptes Discourse du fournisseur OpenID Connect"
    resonite_oauth_verbose_logging: "Consigne les informations d'authentification détaillées d'openid-connect dans « /logs ». Maintenez cette option désactivée pendant l'utilisation normale."
    resonite_oauth_overrides_email: "À chaque connexion, remplacer l'adresse e-mail de l'utilisateur à l'aide de la valeur openid-connect. Fonctionne de la même manière que le paramètre « auth_overrides_email », mais est spécifique aux connexions OpenID Connect."
    resonite_oauth_match_by_email: "Utilisez l'adresse e-mail pour associer les authentifications OpenID Connect aux comptes utilisateur Discourse existants."
    resonite_oauth_use_pkce: "Activez la clé de preuve pour l'échange de codes (PKCE) pour l'authentification OpenID Connect."
  login:
    omniauth_error:
      resonite_oauth_discovery_error: Impossible de récupérer la configuration du fournisseur d'identité. Veuillez réessayer.

